name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize retries of the same tag.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    name: Update Hellbox in pdf.js
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history is needed to check that the release isn't a downgrade.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # No cache: it could be poisoned and end up in the release.
          package-manager-cache: false

      - name: Build the wasm module
        run: |
          node build.js --compile --output "${RUNNER_TEMP}/out" \
            --no-embedded-data --js-fallback

      - name: Verify and read the build metadata
        id: info
        run: |
          expected=$(git rev-parse HEAD)
          node - "${RUNNER_TEMP}/out/hellbox_bg.wasm" "${expected}" <<'EOF'
          const { appendFileSync, writeFileSync } = require("node:fs");
          const { join } = require("node:path");
          const { readBuildMetadata } = require("./tools/build_metadata.js");
          const [, , filename, expected] = process.argv;
          const info = readBuildMetadata(filename);
          if (info === undefined) {
            throw new Error("No build_info section in hellbox_bg.wasm");
          }
          if (info.repo !== expected) {
            throw new Error(`The wasm was built from ${info.repo}, expected ${expected}`);
          }
          if (info.embeddedData !== false) {
            throw new Error("The data files must not be embedded in the wasm");
          }
          const labels = {
            rustc: "Rust",
            wasmBindgen: "wasm-bindgen",
            wasmPack: "wasm-pack",
            binaryen: "Binaryen",
            terser: "Terser",
          };
          const versions = Object.entries(labels).map(([key, label]) => {
            const value = info[key];
            if (typeof value !== "string" || !value || /[^\w.-]/.test(value)) {
              throw new Error(`Invalid ${key} in build_info: ${value}`);
            }
            return `- ${label} version: ${value}\n`;
          });
          writeFileSync(join(process.env.RUNNER_TEMP, "hellbox-versions.md"), versions.join(""));
          appendFileSync(process.env.GITHUB_OUTPUT, `repo=${info.repo}\n`);
          EOF

      - name: Stage the files for pdf.js
        run: |
          STAGE="${RUNNER_TEMP}/stage"
          mkdir "${STAGE}"
          cp "${RUNNER_TEMP}"/out/{hellbox.js,hellbox_bg.wasm,hellbox_nowasm_fallback.js,unicode.bin} \
            "${RUNNER_TEMP}"/out/*.hbgd rust/data/LICENSE_* "${STAGE}/"
          cp LICENSE "${STAGE}/LICENSE_HELLBOX"
          # pdf.js doesn't use Wingdings yet.
          rm -f "${STAGE}/Wingdings.hbgd"

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mozilla
          repositories: pdf.js
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout pdf.js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mozilla/pdf.js
          path: pdf.js
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Create the pull request
        working-directory: pdf.js
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          REPO_REVISION: ${{ steps.info.outputs.repo }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! ${VERSION} =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi
          REPO=mozilla/pdf.js
          BASE=master
          BRANCH="update-hellbox-${VERSION}"
          BRANCH_REF="refs/heads/${BRANCH}"
          TITLE="Update Hellbox to version ${VERSION}"
          DIR=external/hellbox
          VENDORED_FILES=("${DIR}" ":(exclude)${DIR}/README.md")

          # A merged release stays complete even if its branch has been deleted.
          PR_URL=$(gh api --paginate "repos/${REPO}/pulls?head=${REPO%/*}:${BRANCH}&base=${BASE}&state=all" |
            jq -rs --arg repo "${REPO}" '
              first(.[][] | select(.head.repo.full_name == $repo and
                (.state == "open" or .merged_at != null)) | .html_url) // empty
            ')
          if [ -n "${PR_URL}" ]; then
            echo "A pull request already exists for ${BRANCH}: ${PR_URL}"
            exit 0
          fi

          # Only replace a module built from an ancestor of this revision, so that
          # retrying an old tag can't revert a newer release.
          VENDORED_REVISION=$(node - "${DIR}/hellbox_bg.wasm" <<'EOF'
          const { readBuildMetadata } = require("../tools/build_metadata.js");
          const info = readBuildMetadata(process.argv[2]);
          if (info !== undefined) {
            const { repo } = info;
            if (typeof repo !== "string" || !/^[0-9a-f]{40}$/.test(repo)) {
              throw new Error(`Unable to compare with the vendored module built from ${repo}`);
            }
            process.stdout.write(repo);
          }
          EOF
          )
          if [[ -z ${VENDORED_REVISION} ]]; then
            echo "The vendored module has no build metadata."
          elif ! git -C "${GITHUB_WORKSPACE}" merge-base --is-ancestor \
              "${VENDORED_REVISION}" "${REPO_REVISION}"; then
            echo "The vendored module was built from ${VENDORED_REVISION}, which isn't an ancestor of ${REPO_REVISION}." >&2
            exit 1
          fi

          # Replace all the files but the README of pdf.js, so that a removed data
          # file is removed from pdf.js too.
          git rm -rq --ignore-unmatch -- "${VENDORED_FILES[@]}"
          mkdir -p "${DIR}"
          cp "${RUNNER_TEMP}"/stage/* "${DIR}/"
          git add -- "${DIR}"
          if git diff --cached --quiet; then
            echo "Hellbox in pdf.js is already up to date."
            exit 0
          fi

          # An empty lease requires the branch to be absent.
          LEASE=
          REMOTE_BRANCH=$(git ls-remote --refs origin "${BRANCH_REF}")
          if [[ -n ${REMOTE_BRANCH} ]]; then
            # Verify the old branch before replacing it with a commit on the current
            # base, ignoring the README, which pdf.js can have changed since.
            git fetch --no-tags --depth=1 origin "${BRANCH_REF}"
            LEASE=$(git rev-parse FETCH_HEAD)
            if ! git diff --cached --quiet "${LEASE}" -- "${VENDORED_FILES[@]}"; then
              echo "The existing branch ${BRANCH} does not match the rebuilt files." >&2
              exit 1
            fi
          fi

          # The sizes of the files which changed, for the description.
          SIZES=$(git diff --cached --no-renames --name-status -z -- "${VENDORED_FILES[@]}" |
            while IFS= read -r -d '' STATUS && IFS= read -r -d '' FILE; do
              BYTES=removed
              if [[ ${STATUS} != D ]]; then
                BYTES=$(stat -c %s -- "${FILE}") || exit 1
              fi
              printf '| `%s` | %s |\n' "${FILE##*/}" "${BYTES}"
            done)
          TOOL_VERSIONS=$(<"${RUNNER_TEMP}/hellbox-versions.md")

          git -c 'user.name=github-actions[bot]' \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "${TITLE}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
          git push --force-with-lease="${BRANCH_REF}:${LEASE}" origin "HEAD:${BRANCH_REF}"

          gh pr create --repo "${REPO}" --base "${BASE}" --head "${BRANCH}" \
            --title "${TITLE}" --body-file - <<EOF
          - Hellbox version: ${VERSION}
          - Hellbox commit: [\`${REPO_REVISION}\`](https://github.com/mozilla/hellbox/commit/${REPO_REVISION})
          ${TOOL_VERSIONS}

          | Changed file | Bytes |
          | --- | ---: |
          ${SIZES}
          EOF
